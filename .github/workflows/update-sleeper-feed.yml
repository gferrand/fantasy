name: Update Sleeper feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sleeper-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, validate, and build compact feed
        run: python scripts/build_sleeper_feed.py

      - name: Publish rendered task snapshots to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/sleeper_feed.json public/sleeper_available_players.json \
            public/sleeper_feed.html public/sleeper_available_players.html \
            public/sleeper_task_core.md public/sleeper_task_available.md
          if git diff --cached --quiet; then
            echo "No feed changes to commit"
          else
            git commit -m "Update Sleeper task snapshots [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
